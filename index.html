<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIP নাম্বার ফাইন্ডার</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif;color:#f1f0ff;background:linear-gradient(160deg,#120d2e,#1f1650 55%,#2a1d6b);padding:14px 12px 40px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:20px;margin:6px 0 2px;text-align:center}
  .sub{text-align:center;font-size:12px;opacity:.7;margin-bottom:14px}
  .card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:12px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 10px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .tile{position:relative;padding:14px 4px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:20px;font-weight:700;letter-spacing:2px;cursor:pointer}
  .tile:active{transform:scale(.97)}
  .tile.on{background:#6d3fe0;border-color:#a78bfa;box-shadow:0 0 0 2px rgba(167,139,250,.4)}
  .tile .b{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#16a34a;color:#fff;font-size:11px;letter-spacing:0;line-height:20px}
  .bar{height:9px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;margin:8px 0}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,#a78bfa,#34d399);transition:width .2s}
  .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
  .stat{font-size:13px;opacity:.9;line-height:1.5}
  .stop{padding:9px 14px;border:0;border-radius:12px;background:#7f1d3a;color:#fff;font-size:14px}
  .num{display:flex;justify-content:space-between;align-items:center;padding:13px 12px;margin-top:7px;border-radius:12px;background:rgba(109,63,224,.28);font-size:20px;letter-spacing:1px;cursor:pointer}
  .num b{color:#fde68a}
  .num small{font-size:12px;opacity:.75;letter-spacing:0}
  .empty{opacity:.65;font-size:14px;padding:6px 0}
  .warn{color:#fcd34d;font-size:12px;margin-top:4px}
  .pos{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
  .pos input{width:100%;padding:11px 0;text-align:center;font-size:20px;font-weight:700;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.09);color:#fff;outline:none}
  .pos input:focus{border-color:#a78bfa;box-shadow:0 0 0 2px rgba(167,139,250,.35)}
  .pl{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:4px;font-size:10px;opacity:.55;text-align:center}
  .ops{display:flex;gap:6px;margin:10px 0 8px}
  .ops button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font-size:13px}
  .ops button.on{background:#6d3fe0;border-color:#a78bfa}
  .go{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(90deg,#7c3aed,#6d28d9);color:#fff;font-size:17px;font-weight:700}
  .go:disabled{opacity:.45}
  .hint{font-size:12px;opacity:.8;margin:8px 0;line-height:1.5}
  .api{font-size:11px;opacity:.7;margin-top:6px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <h1>💎 VIP নাম্বার ফাইন্ডার</h1>
  <div class="sub">যেকোনো ঘরে ক্লিক করুন, এয়ারটেল (016) ও রবি (018) দুটোতেই অটো খুঁজবে</div>

  <div class="card">
    <h2>৫ ডিজিট একই (যেমন 11111)</h2>
    <div class="grid" id="g5"></div>
  </div>
  <div class="card">
    <h2>৬ ডিজিট একই (যেমন 111111)</h2>
    <div class="grid" id="g6"></div>
  </div>

  <div class="card">
    <h2>✏️ কাস্টম (৮ ঘর)</h2>
    <div class="pl"><span>১</span><span>২</span><span>৩</span><span>৪</span><span>৫</span><span>৬</span><span>৭</span><span>৮</span></div>
    <div class="pos" id="pos"></div>
    <div class="ops" id="ops">
      <button type="button" data-op="both" class="on">দুটোই</button>
      <button type="button" data-op="016">এয়ারটেল 016</button>
      <button type="button" data-op="018">রবি 018</button>
    </div>
    <div class="hint" id="cHint"></div>
    <button class="go" id="cGo" disabled>🔎 সার্চ করুন</button>
  </div>

  <div class="card" id="resCard" style="display:none">
    <div class="row">
      <div style="font-size:17px;font-weight:700" id="resTitle"></div>
      <button class="stop" id="stopBtn">⏹ থামান</button>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="stat" id="stat"></div>
    <div class="warn" id="warn"></div>
    <div class="api" id="apiNote"></div>
    <div id="list"></div>
  </div>
</div>

<script>
(function () {
  const API = 'https://da-api.robi.com.bd/da-nll/free-msisdn/get-msisdn-list';
  const BR = [
    { brand: 'AIRTEL', base: '88016', code: '016' },
    { brand: 'ROBI',   base: '88018', code: '018' }
  ];
  const KEY = 'vipFinder_v3';
  const CONC = 8;
  const MAX_FREE = 5; // সর্বোচ্চ ৫টি ঘর খালি = ১,০০,০০০ নাম্বার

  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

  let runId = 0, ctrl = null, activeKey = null, opSel = 'both';

  // ---------- ঘর (tile) ----------
  function badge(key) {
    const n = (saved[key] || []).length;
    return n ? `<span class="b">${n}</span>` : '';
  }
  function buildTiles() {
    [[5, 'g5'], [6, 'g6']].forEach(([len, id]) => {
      const g = $(id);
      g.innerHTML = '';
      for (let d = 0; d < 10; d++) {
        const pat = String(d).repeat(len);
        const b = document.createElement('button');
        b.className = 'tile' + (pat === activeKey ? ' on' : '');
        b.dataset.pat = pat;
        b.innerHTML = pat + badge(pat);
        b.addEventListener('click', () => startPattern(pat));
        g.appendChild(b);
      }
    });
  }

  // ---------- সাফিক্স জেনারেটর ----------
  function patternSuffixes(pat) {
    const free = 8 - pat.length, total = Math.pow(10, free), set = new Set();
    for (let s = 0; s <= free; s++)
      for (let k = 0; k < total; k++) {
        const f = String(k).padStart(free, '0');
        set.add(f.slice(0, s) + pat + f.slice(s));
      }
    return [...set];
  }
  function maskSuffixes(mask) { // mask: ৮ অক্ষরের array, খালি = ''
    const freePos = [];
    mask.forEach((v, i) => { if (v === '') freePos.push(i); });
    const total = Math.pow(10, freePos.length), out = [];
    for (let k = 0; k < total; k++) {
      const f = String(k).padStart(freePos.length, '0');
      const d = mask.slice();
      freePos.forEach((p, j) => { d[p] = f[j]; });
      out.push(d.join(''));
    }
    return out;
  }

  // ---------- API চেক ----------
  async function check(brand, number, signal, stats) {
    for (let a = 0; a < 4; a++) {
      if (signal.aborted) return null;
      const c = new AbortController();
      const onAbort = () => c.abort();
      signal.addEventListener('abort', onAbort);
      const t = setTimeout(() => c.abort(), 15000);
      try {
        const r = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ msisdn: number, brand, simCategory: 'PREPAID' }),
          signal: c.signal
        });
        if (r.ok) {
          const data = await r.json();
          if (!stats.sample) {
            stats.sample = `${number} → ${JSON.stringify(data).slice(0, 160)}`;
            $('apiNote').textContent = 'API উত্তরের নমুনা: ' + stats.sample;
          }
          return !!data && data.available === true;
        }
        stats.lastErr = 'HTTP ' + r.status;
        if (r.status === 429) await sleep(1500 * (a + 1));
      } catch (e) {
        if (signal.aborted) return null;
        stats.lastErr = 'নেটওয়ার্ক/টাইমআউট';
      } finally {
        clearTimeout(t);
        signal.removeEventListener('abort', onAbort);
      }
      await sleep(400 * Math.pow(2, a));
    }
    return undefined;
  }

  function show(job, found) {
    const list = $('list');
    list.innerHTML = '';
    if (!found.length) { list.innerHTML = '<div class="empty">এখনও কোনো নাম্বার পাওয়া যায়নি</div>'; return; }
    found.slice().sort().forEach(n => {
      const el = document.createElement('div');
      el.className = 'num';
      const op = n.startsWith('016') ? 'এয়ারটেল' : 'রবি';
      el.innerHTML = `<span>${job.hl(n)}</span><small>${op} · কপি</small>`;
      el.addEventListener('click', () => {
        try { navigator.clipboard.writeText(n); } catch (e) {}
        $('warn').textContent = 'কপি হয়েছে: ' + n;
      });
      list.appendChild(el);
    });
  }

  function stop() { runId++; if (ctrl) ctrl.abort(); }

  async function run(job) {
    stop();
    const id = runId;
    ctrl = new AbortController();
    const signal = ctrl.signal;
    activeKey = job.key;
    buildTiles();

    $('resCard').style.display = 'block';
    $('resTitle').textContent = '🔎 ' + job.title;
    $('warn').textContent = '';
    $('apiNote').textContent = '';
    $('bar').style.width = '0%';
    $('stat').textContent = 'শুরু হচ্ছে...';
    $('resCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

    const tasks = [];
    for (const sfx of job.suffixes) for (const b of job.brands) tasks.push({ b, n: b.base + sfx });
    const total = tasks.length;
    const found = [];
    const stats = {};
    let done = 0, failed = 0, i = 0;
    const t0 = Date.now();
    show(job, found);

    const tick = () => {
      const sec = (Date.now() - t0) / 1000;
      const speed = done / Math.max(sec, 1);
      const left = Math.round((total - done) / Math.max(speed, 0.1));
      $('bar').style.width = (done / total * 100) + '%';
      $('stat').innerHTML = `চেক হয়েছে ${done}/${total} · পাওয়া গেছে <b>${found.length}</b> টি<br>গতি ${speed.toFixed(1)}/সেকেন্ড · বাকি প্রায় ${Math.floor(left / 60)} মি ${left % 60} সে` + (failed ? ` · ব্যর্থ ${failed}` : '');
      if (failed > 20 && failed > done * 0.2) $('warn').textContent = '⚠️ অনেক রিকোয়েস্ট ব্যর্থ (' + (stats.lastErr || '') + '), নেট বা API সীমা চেক করুন';
    };

    const worker = async () => {
      while (i < total && id === runId) {
        const { b, n } = tasks[i++];
        const res = await check(b.brand, n, signal, stats);
        if (id !== runId) return;
        done++;
        if (res === undefined) failed++;
        if (res === true) {
          found.push('0' + n.slice(3));
          show(job, found);
          saved[job.key] = found.slice();
          try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
        }
        if (done % 10 === 0 || done === total) tick();
      }
    };
    await Promise.all(Array.from({ length: CONC }, worker));
    if (id !== runId) return;

    saved[job.key] = found.slice();
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
    buildTiles();
    tick();
    $('bar').style.width = '100%';
    $('stat').innerHTML = `✅ সম্পন্ন: ${total} টি চেক, পাওয়া গেছে <b>${found.length}</b> টি` + (failed ? ` · ${failed} টি ব্যর্থ` : '');
  }

  function startPattern(pat) {
    run({
      key: pat, title: pat,
      suffixes: patternSuffixes(pat), brands: BR,
      hl: n => { const i = n.indexOf(pat); return i < 0 ? n : `${n.slice(0, i)}<b>${pat}</b>${n.slice(i + pat.length)}`; }
    });
  }

  // ---------- কাস্টম ৮ ঘর ----------
  const posWrap = $('pos'), boxes = [];
  for (let p = 0; p < 8; p++) {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.inputMode = 'numeric'; inp.maxLength = 1; inp.autocomplete = 'off';
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 1);
      if (inp.value && p < 7) boxes[p + 1].focus();
      refresh();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && p > 0) boxes[p - 1].focus(); });
    inp.addEventListener('paste', e => {
      const t = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
      if (!t) return;
      e.preventDefault();
      for (let k = 0; k < t.length && p + k < 8; k++) boxes[p + k].value = t[k];
      refresh();
    });
    posWrap.appendChild(inp);
    boxes.push(inp);
  }
  function mask() { return boxes.map(b => b.value); }
  function selBrands() { return opSel === 'both' ? BR : BR.filter(b => b.code === opSel); }

  function refresh() {
    const m = mask(), free = m.filter(v => v === '').length, fixed = 8 - free;
    const go = $('cGo'), hint = $('cHint');
    const count = Math.pow(10, free) * selBrands().length;
    if (fixed === 0) { hint.textContent = 'যে ঘরগুলোর ডিজিট জানেন বসান, বাকি ঘর খালি রাখুন (খালি ঘরে ০-৯ সব চেক হবে)। যেমন: 5555 6666'; go.disabled = true; return; }
    if (free > MAX_FREE) {
      hint.textContent = `⚠️ সর্বোচ্চ ${MAX_FREE}টি ঘর খালি রাখা যাবে (৯৯,৯৯৯ নাম্বার)। আরও ${free - MAX_FREE}টি ঘরে ডিজিট দিন।`;
      go.disabled = true; return;
    }
    const mins = Math.max(1, Math.round(count / 7 / 60));
    hint.textContent = `${fixed}টি ডিজিট দেওয়া, ${free}টি খালি → মোট ${count.toLocaleString()} টি চেক হবে (প্রায় ${mins} মিনিট)`;
    go.disabled = false;
  }
  $('ops').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    opSel = b.dataset.op;
    $('ops').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    refresh();
  }));
  $('cGo').addEventListener('click', () => {
    const m = mask(), brands = selBrands();
    const label = m.map(v => v === '' ? '•' : v).join('');
    run({
      key: 'c:' + label + ':' + opSel, title: label,
      suffixes: maskSuffixes(m), brands,
      hl: n => n.slice(0, 3) + n.slice(3).split('').map((ch, i) => m[i] === '' ? ch : `<b>${ch}</b>`).join('')
    });
  });
  refresh();

  $('stopBtn').addEventListener('click', () => { stop(); $('stat').innerHTML += '<br>⏹ থামানো হয়েছে'; });
  buildTiles();
})();
</script>
</body>
</html>
